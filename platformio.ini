[platformio]
default_envs = tdisplay-s3

[env:tdisplay-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM17
upload_speed = 921600

board_build.partitions = partitions_tds3.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; GyverButton is vendored into src/ (not lib_deps) on purpose: its pin reads go
; through espHackDigitalRead() so that the four logical buttons resolve to the
; gesture engine instead of a GPIO. Two copies would also clash at link time.
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    moononournation/GFX Library for Arduino@^1.6.4
    crankyoldgit/IRremoteESP8266@^2.9.0
    lsatan/SmartRC-CC1101-Driver-Lib@^3.0.2
    sui77/rc-switch@^2.6.4
    h2zero/NimBLE-Arduino@^2.5.0
    nrf24/RF24@^1.6.1
    paulstoffregen/OneWire@^2.3.8
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0

build_flags =
    -Wl,-z,muldefs
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -Os

build_unflags =
    -std=gnu++11

extra_scripts =
    post:build.py
